<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-kkweb-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Meal Prep">
<title>Meal Prep</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: -apple-system, sans-serif; background: #f5f5f0; color: #1a1a1a; min-height: 100vh; padding-bottom: 90px; }
header { background: #fff; border-bottom: 0.5px solid #e0e0d8; padding: 52px 20px 14px; }
header h1 { font-size: 22px; font-weight: 600; }
header p { font-size: 13px; color: #999; margin-top: 2px; }
.tabs { display: flex; background: #fff; border-bottom: 0.5px solid #e0e0d8; position: sticky; top: 0; z-index: 10; }
.tab { flex: 1; padding: 12px 6px; text-align: center; font-size: 13px; color: #999; border: none; background: none; cursor: pointer; border-bottom: 2px solid transparent; }
.tab.active { color: #2d7a4f; border-bottom-color: #2d7a4f; font-weight: 500; }
.section { display: none; padding: 16px; }
.section.active { display: block; }

.card { background: #fff; border-radius: 14px; border: 0.5px solid #e0e0d8; margin-bottom: 12px; overflow: hidden; }
.card-header { padding: 12px 16px; background: #f9f9f6; border-bottom: 0.5px solid #e0e0d8; }
.card-title { font-size: 14px; font-weight: 600; color: #1a1a1a; }
.card-sub { font-size: 12px; color: #aaa; margin-top: 2px; }

.pantry-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 14px 16px; }
.pantry-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 10px; border: 0.5px solid #e0e0d8; cursor: pointer; background: #fff; }
.pantry-item.selected { background: #edf7f1; border-color: #2d7a4f; }
.pantry-check { width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid #ddd; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
.pantry-item.selected .pantry-check { background: #2d7a4f; border-color: #2d7a4f; color: #fff; font-size: 11px; font-weight: 700; }
.pantry-label { font-size: 13px; color: #333; }

.controls { display: flex; align-items: center; gap: 12px; background: #fff; border-radius: 12px; padding: 14px 16px; border: 0.5px solid #e0e0d8; margin-bottom: 10px; }
.controls label { font-size: 14px; color: #555; flex: 1; }
.controls input { width: 56px; padding: 6px; border-radius: 8px; border: 0.5px solid #ddd; text-align: center; font-size: 15px; }
.gen-btn { width: 100%; padding: 14px; border-radius: 12px; border: none; background: #2d7a4f; color: #fff; font-size: 15px; font-weight: 500; cursor: pointer; margin-bottom: 16px; }

.day-card { background: #fff; border-radius: 14px; border: 0.5px solid #e0e0d8; margin-bottom: 12px; overflow: hidden; }
.day-header { padding: 12px 16px; background: #f9f9f6; border-bottom: 0.5px solid #e0e0d8; display: flex; justify-content: space-between; align-items: center; }
.day-name { font-size: 15px; font-weight: 600; }
.day-num { font-size: 12px; color: #aaa; }
.meals { padding: 12px 16px; display: flex; flex-direction: column; gap: 12px; }
.meal-row { display: flex; align-items: flex-start; gap: 10px; }
.meal-type { font-size: 11px; font-weight: 600; color: #aaa; text-transform: uppercase; letter-spacing: 0.06em; min-width: 56px; padding-top: 2px; }
.meal-info { flex: 1; }
.meal-name { font-size: 14px; color: #1a1a1a; line-height: 1.4; }
.meal-tags { display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap; }
.tag { font-size: 10px; padding: 2px 7px; border-radius: 20px; font-weight: 500; }
.tag-p { background: #edf7f1; color: #2d7a4f; }
.tag-f { background: #fff3e0; color: #e07b00; }
.tag-c { background: #e8f0fe; color: #1a56c4; }
.recipe-btn { font-size: 12px; color: #2d7a4f; background: none; border: none; cursor: pointer; padding: 4px 0 0; display: block; }
.recipe-panel { display: none; background: #f5f5f0; border-radius: 10px; padding: 12px; margin-top: 10px; }
.recipe-panel.open { display: block; }
.r-title { font-size: 14px; font-weight: 600; margin-bottom: 8px; }
.r-label { font-size: 11px; font-weight: 600; color: #888; text-transform: uppercase; letter-spacing: 0.05em; margin: 8px 0 4px; }
.r-item { font-size: 13px; color: #333; padding: 2px 0; }
.r-note { font-size: 12px; color: #888; font-style: italic; margin-top: 8px; }

.shop-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.shop-title { font-size: 15px; font-weight: 600; }
.shop-sub { font-size: 12px; color: #aaa; }
.shop-section-title { font-size: 11px; font-weight: 600; color: #aaa; text-transform: uppercase; letter-spacing: 0.06em; margin: 16px 0 8px; }
.shop-item { display: flex; align-items: center; gap: 12px; background: #fff; border-radius: 12px; border: 0.5px solid #e0e0d8; padding: 13px 16px; margin-bottom: 8px; cursor: pointer; }
.shop-item.checked { opacity: 0.4; }
.shop-item.checked .shop-name { text-decoration: line-through; }
.shop-item.already { background: #f9f9f6; border-color: #e0e0d8; opacity: 0.5; }
.check-circle { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid #ddd; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 12px; font-weight: 700; color: transparent; }
.shop-item.checked .check-circle { background: #2d7a4f; border-color: #2d7a4f; color: #fff; }
.shop-name { font-size: 14px; flex: 1; }
.shop-qty { font-size: 12px; color: #aaa; }
.copy-btn { width: 100%; padding: 14px; border-radius: 12px; border: 0.5px solid #ddd; background: #fff; color: #555; font-size: 14px; cursor: pointer; margin-top: 4px; }
.empty { text-align: center; padding: 40px 20px; color: #aaa; font-size: 14px; }
.badge-already { font-size: 10px; background: #eee; color: #888; padding: 2px 7px; border-radius: 20px; }
</style>
</head>
<body>

<header>
  <h1>Meal Prep</h1>
  <p>Vegan · Équilibré · Anti-gaspi</p>
</header>

<div class="tabs">
  <button class="tab active" onclick="switchTab('pantry', this)">Frigo</button>
  <button class="tab" onclick="switchTab('calendar', this)">Plan</button>
  <button class="tab" onclick="switchTab('shopping', this)">Courses</button>
</div>

<div id="pantry" class="section active">
  <div class="card">
    <div class="card-header">
      <div class="card-title">Ce que j'ai déjà</div>
      <div class="card-sub">Sélectionne les ingrédients disponibles chez toi</div>
    </div>
    <div class="pantry-grid" id="pantryGrid"></div>
  </div>
  <button class="gen-btn" onclick="switchTab('calendar', document.querySelectorAll('.tab')[1]); generatePlan();">Générer mon plan →</button>
</div>

<div id="calendar" class="section">
  <div class="controls">
    <label>Nombre de jours</label>
    <input type="number" id="dayCount" value="5" min="1" max="7">
  </div>
  <button class="gen-btn" onclick="generatePlan()">Nouveau plan</button>
  <div id="calendarGrid"></div>
</div>

<div id="shopping" class="section">
  <div id="shoppingList"><div class="empty">Génère un plan pour voir ta liste de courses.</div></div>
  <button class="copy-btn" id="copyBtn" onclick="copyList()" style="display:none">Copier la liste à acheter</button>
</div>

<script>
const PANTRY_ITEMS = [
  { id: "pates", label: "Pâtes" },
  { id: "riz", label: "Riz" },
  { id: "lentilles", label: "Lentilles" },
  { id: "pois_chiches", label: "Pois chiches" },
  { id: "tofu", label: "Tofu" },
  { id: "edamame", label: "Edamame" },
  { id: "epinards", label: "Épinards" },
  { id: "tomates", label: "Tomates cerises" },
  { id: "concombre", label: "Concombre" },
  { id: "avocat", label: "Avocat" },
  { id: "jambon_veg", label: "Jambon végétal" },
  { id: "fromage_veg", label: "Fromage végétal" },
  { id: "galettes", label: "Galettes de riz" },
  { id: "gaspacho", label: "Gaspacho" },
  { id: "pain_seigle", label: "Pain de seigle" },
  { id: "sauce_soja", label: "Sauce soja" },
  { id: "beurre_cac", label: "Beurre cacahuète" },
  { id: "aubergine", label: "Aubergine" },
  { id: "quinoa", label: "Quinoa" },
  { id: "soupe", label: "Soupe" },
];

let pantry = {};

const MEALS = {
  dejeuner: [
    {
      name: "Pâtes épinards et pois chiches",
      needs: ["pates", "pois_chiches", "epinards"],
      tags: ["P", "F", "C"],
      ingredients: [
        { item: "pates", qty: "100g de pâtes" },
        { item: "pois_chiches", qty: "½ boîte de pois chiches" },
        { item: "epinards", qty: "2 poignées d'épinards frais" },
        { item: null, qty: "1 gousse d'ail, huile d'olive, sel" },
      ],
      steps: ["Cuire les pâtes.", "Faire revenir l'ail avec épinards et pois chiches 3 min.", "Mélanger avec les pâtes."],
      note: "Économique : une boîte de pois chiches dure 2 repas."
    },
    {
      name: "Riz aubergine et lentilles",
      needs: ["riz", "lentilles", "aubergine"],
      tags: ["P", "F", "C"],
      ingredients: [
        { item: "riz", qty: "100g de riz" },
        { item: "aubergine", qty: "½ aubergine en dés" },
        { item: "lentilles", qty: "½ boîte de lentilles" },
        { item: null, qty: "Huile d'olive, cumin, sel" },
      ],
      steps: ["Rôtir l'aubergine au four 20 min à 200°C.", "Cuire le riz.", "Mélanger avec les lentilles rincées."],
      note: "½ aubergine le midi, ½ aubergine pour un autre repas."
    },
    {
      name: "Riz tofu sauté et épinards",
      needs: ["riz", "tofu", "epinards", "sauce_soja"],
      tags: ["P", "F", "C"],
      ingredients: [
        { item: "riz", qty: "100g de riz" },
        { item: "tofu", qty: "100g de tofu ferme" },
        { item: "epinards", qty: "2 poignées d'épinards" },
        { item: "sauce_soja", qty: "1 c. à soupe de sauce soja" },
        { item: "tomates", qty: "Quelques tomates cerises" },
      ],
      steps: ["Cuire le riz.", "Dorer le tofu avec sauce soja 5 min.", "Ajouter épinards 2 min. Servir sur le riz."],
      note: ""
    },
    {
      name: "Bowl quinoa et pois chiches",
      needs: ["quinoa", "pois_chiches", "epinards", "concombre"],
      tags: ["P", "F", "C"],
      ingredients: [
        { item: "quinoa", qty: "100g de quinoa" },
        { item: "pois_chiches", qty: "½ boîte de pois chiches" },
        { item: "epinards", qty: "1 poignée d'épinards" },
        { item: "concombre", qty: "¼ de concombre" },
        { item: null, qty: "Citron, huile d'olive, sel" },
      ],
      steps: ["Cuire le quinoa.", "Rincer les pois chiches.", "Assembler et assaisonner."],
      note: ""
    },
    {
      name: "Pâtes lentilles et tomates",
      needs: ["pates", "lentilles", "tomates"],
      tags: ["P", "F", "C"],
      ingredients: [
        { item: "pates", qty: "100g de pâtes" },
        { item: "lentilles", qty: "½ boîte de lentilles" },
        { item: "tomates", qty: "Une poignée de tomates cerises" },
        { item: null, qty: "Ail, basilic, huile d'olive" },
      ],
      steps: ["Cuire les pâtes.", "Faire revenir l'ail et tomates 5 min, ajouter lentilles.", "Mélanger avec les pâtes."],
      note: ""
    },
  ],
  diner: [
    {
      name: "Gaspacho et wrap jambon végétal",
      needs: ["gaspacho", "galettes", "jambon_veg", "fromage_veg"],
      tags: ["P", "F"],
      ingredients: [
        { item: "gaspacho", qty: "1 bol de gaspacho" },
        { item: "galettes", qty: "1 galette de riz" },
        { item: "jambon_veg", qty: "2 tranches de jambon végétal" },
        { item: "fromage_veg", qty: "1 portion de fromage végétal" },
        { item: null, qty: "Salade, concombre, tomate" },
      ],
      steps: ["Tremper la galette 15 sec.", "Garnir et rouler.", "Servir avec le gaspacho."],
      note: "Repas zéro cuisson, prêt en 3 min."
    },
    {
      name: "Rouleaux de printemps et gaspacho",
      needs: ["galettes", "jambon_veg", "gaspacho", "sauce_soja", "beurre_cac"],
      tags: ["P", "F"],
      ingredients: [
        { item: "galettes", qty: "2 galettes de riz" },
        { item: "jambon_veg", qty: "2 tranches de jambon végétal" },
        { item: "gaspacho", qty: "1 bol de gaspacho" },
        { item: "sauce_soja", qty: "1 c. à soupe sauce soja" },
        { item: "beurre_cac", qty: "1 c. à café beurre de cacahuète" },
        { item: null, qty: "Salade, concombre, tomate" },
      ],
      steps: ["Tremper les galettes 15 sec.", "Garnir et rouler serré.", "Mélanger sauce soja + beurre de cacahuète pour tremper."],
      note: ""
    },
    {
      name: "Soupe et toast fromage végétal",
      needs: ["soupe", "pain_seigle", "fromage_veg", "epinards"],
      tags: ["P", "F"],
      ingredients: [
        { item: "soupe", qty: "1 bol de soupe" },
        { item: "pain_seigle", qty: "2 tranches de pain de seigle" },
        { item: "fromage_veg", qty: "1 portion de fromage végétal" },
        { item: "epinards", qty: "1 poignée d'épinards en salade" },
      ],
      steps: ["Chauffer la soupe.", "Toaster le pain et tartiner.", "Servir avec salade d'épinards."],
      note: "Léger et rassasiant."
    },
    {
      name: "Bowl edamame riz et légumes",
      needs: ["riz", "edamame", "epinards", "sauce_soja"],
      tags: ["P", "F", "C"],
      ingredients: [
        { item: "riz", qty: "100g de riz" },
        { item: "edamame", qty: "80g d'edamame surgelé" },
        { item: "epinards", qty: "1 poignée d'épinards" },
        { item: "sauce_soja", qty: "1 c. à soupe sauce soja" },
        { item: "concombre", qty: "¼ de concombre" },
      ],
      steps: ["Cuire riz et edamame selon les paquets.", "Assembler le bowl.", "Assaisonner avec sauce soja."],
      note: ""
    },
    {
      name: "Wrap avocat et pois chiches",
      needs: ["galettes", "avocat", "pois_chiches"],
      tags: ["P", "F", "C"],
      ingredients: [
        { item: "galettes", qty: "1 galette de riz" },
        { item: "avocat", qty: "½ avocat écrasé" },
        { item: "pois_chiches", qty: "½ boîte de pois chiches rôtis" },
        { item: null, qty: "Salade, tomates cerises, citron, sel" },
      ],
      steps: ["Écraser l'avocat avec citron et sel.", "Étaler sur la galette.", "Garnir et rouler."],
      note: "Rôtis les pois chiches 15 min au four pour le croustillant."
    },
  ]
};

let currentPlan = [];
let openPanel = null;

function renderPantry() {
  const grid = document.getElementById('pantryGrid');
  grid.innerHTML = PANTRY_ITEMS.map(p => `
    <div class="pantry-item ${pantry[p.id] ? 'selected' : ''}" onclick="togglePantry('${p.id}', this)">
      <div class="pantry-check">${pantry[p.id] ? '✓' : ''}</div>
      <span class="pantry-label">${p.label}</span>
    </div>
  `).join('');
}

function togglePantry(id, el) {
  pantry[id] = !pantry[id];
  el.classList.toggle('selected');
  el.querySelector('.pantry-check').textContent = pantry[id] ? '✓' : '';
}

function score(meal) {
  return meal.needs.filter(n => pantry[n]).length;
}

function generatePlan() {
  const n = Math.min(7, Math.max(1, parseInt(document.getElementById('dayCount').value) || 5));
  const DAYS = ["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"];

  const sortByPantry = arr => [...arr].sort((a,b) => score(b) - score(a));
  const dej = sortByPantry(MEALS.dejeuner);
  const din = sortByPantry(MEALS.diner);

  currentPlan = [];
  for (let i = 0; i < n; i++) {
    currentPlan.push({ day: DAYS[i], dejeuner: dej[i % dej.length], diner: din[i % din.length] });
  }
  renderCalendar();
  renderShopping();
}

function tagLabel(t) {
  if (t === 'P') return '<span class="tag tag-p">Protéines</span>';
  if (t === 'F') return '<span class="tag tag-f">Fibres</span>';
  if (t === 'C') return '<span class="tag tag-c">Glucides</span>';
  return '';
}

function renderCalendar() {
  const grid = document.getElementById('calendarGrid');
  grid.innerHTML = '';
  currentPlan.forEach((item, idx) => {
    const d = document.createElement('div');
    d.className = 'day-card';
    d.innerHTML = `
      <div class="day-header"><span class="day-name">${item.day}</span><span class="day-num">Jour ${idx+1}</span></div>
      <div class="meals">
        <div class="meal-row">
          <span class="meal-type">Déjeuner</span>
          <div class="meal-info">
            <div class="meal-name">${item.dejeuner.name}</div>
            <div class="meal-tags">${item.dejeuner.tags.map(tagLabel).join('')}</div>
            <button class="recipe-btn" onclick="toggleRecipe('r${idx}d')">Voir la recette ▾</button>
            <div class="recipe-panel" id="r${idx}d">${recipeHTML(item.dejeuner)}</div>
          </div>
        </div>
        <div class="meal-row">
          <span class="meal-type">Dîner</span>
          <div class="meal-info">
            <div class="meal-name">${item.diner.name}</div>
            <div class="meal-tags">${item.diner.tags.map(tagLabel).join('')}</div>
            <button class="recipe-btn" onclick="toggleRecipe('r${idx}n')">Voir la recette ▾</button>
            <div class="recipe-panel" id="r${idx}n">${recipeHTML(item.diner)}</div>
          </div>
        </div>
      </div>`;
    grid.appendChild(d);
  });
}

function recipeHTML(meal) {
  const ings = meal.ingredients.map(i => {
    const inPantry = i.item && pantry[i.item];
    return `<div class="r-item">${inPantry ? '✓ ' : '• '}${i.qty}${inPantry ? ' <span style="color:#2d7a4f;font-size:11px">(déjà chez toi)</span>' : ''}</div>`;
  }).join('');
  return `
    <div class="r-title">${meal.name}</div>
    <div class="r-label">Ingrédients</div>
    ${ings}
    <div class="r-label">Préparation</div>
    ${meal.steps.map((s,i)=>`<div class="r-item">${i+1}. ${s}</div>`).join('')}
    ${meal.note ? `<div class="r-note">💡 ${meal.note}</div>` : ''}
  `;
}

function toggleRecipe(id) {
  if (openPanel && openPanel !== id) {
    const p = document.getElementById(openPanel);
    if (p) p.classList.remove('open');
  }
  const el = document.getElementById(id);
  el.classList.toggle('open');
  openPanel = el.classList.contains('open') ? id : null;
}

function renderShopping() {
  if (!currentPlan.length) return;
  const needed = {};
  currentPlan.forEach(item => {
    [...item.dejeuner.ingredients, ...item.diner.ingredients].forEach(ing => {
      if (!ing.item) return;
      if (!needed[ing.item]) needed[ing.item] = { qty: ing.qty, inPantry: !!pantry[ing.item] };
    });
  });

  const toBuy = Object.entries(needed).filter(([,v]) => !v.inPantry);
  const have = Object.entries(needed).filter(([,v]) => v.inPantry);

  const pantryMap = {};
  PANTRY_ITEMS.forEach(p => { pantryMap[p.id] = p.label; });

  const list = document.getElementById('shoppingList');
  let html = '';

  if (toBuy.length) {
    html += `<div class="shop-section-title">À acheter (${toBuy.length} articles)</div>`;
    html += toBuy.map(([id, v], i) => `
      <div class="shop-item" id="si${i}" onclick="toggleCheck(${i})">
        <div class="check-circle">✓</div>
        <span class="shop-name">${pantryMap[id] || id}</span>
        <span class="shop-qty">${v.qty}</span>
      </div>`).join('');
  }

  if (have.length) {
    html += `<div class="shop-section-title">Déjà à la maison ✓</div>`;
    html += have.map(([id]) => `
      <div class="shop-item already">
        <div class="check-circle" style="background:#2d7a4f;border-color:#2d7a4f;color:#fff">✓</div>
        <span class="shop-name">${pantryMap[id] || id}</span>
        <span class="badge-already">déjà là</span>
      </div>`).join('');
  }

  list.innerHTML = html || '<div class="empty">Aucun ingrédient détecté.</div>';
  document.getElementById('copyBtn').style.display = toBuy.length ? 'block' : 'none';
}

function toggleCheck(i) {
  const el = document.getElementById('si'+i);
  el.classList.toggle('checked');
}

function copyList() {
  const items = [...document.querySelectorAll('.shop-item:not(.already):not(.checked) .shop-name')].map(el => '- ' + el.textContent).join('\n');
  navigator.clipboard.writeText(items).then(() => alert('Liste copiée !')).catch(() => {});
}

function switchTab(id, btn) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  if (typeof btn === 'object' && btn.classList) btn.classList.add('active');
  else document.querySelectorAll('.tab')[['pantry','calendar','shopping'].indexOf(id)].classList.add('active');
  document.getElementById(id).classList.add('active');
}

renderPantry();
</script>
</body>
</html>
